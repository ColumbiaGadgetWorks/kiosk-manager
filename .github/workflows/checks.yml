name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile
        run: python -m compileall -q kiosk_manager
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v
      - name: Installer syntax
        run: bash -n install.sh && bash -n uninstall.sh
